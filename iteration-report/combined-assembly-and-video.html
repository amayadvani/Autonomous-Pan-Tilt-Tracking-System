<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Combined Assembly and Video — Design Iteration Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/report-style.css">
</head>
<body>

<header id="site-header"></header>
<main id="content-root" class="report-content"></main>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>

<script src="../cad_viewer.js"></script>
<script src="js/report-common.js"></script>
<script>
    renderReportHeader('combined');

    renderReportContent('content-root', [
        { type: 'page-title', text: 'Combined Assembly and Video' },
       {
            type: 'text',
            html: `<h3 class="report-subheading">Automation Requirements: with no manual input after power-on</h3>
            <ul class="report-bullets">
            <li><strong>1. </strong> Find the target anywhere in its field of view during a one-time startup scan.</li>
            <li><strong>2. </strong> Hold on the target as long as it stayed in range.</li>
            <li><strong>3. </strong> A simple ultrasonic range finder, simulating satellite distance as signal strength.</li>
            </ul>`
        },
        {
            type: 'viewer',
            label: 'Final System Assembly',
            stlPath: '../assembled/Autonomous-Pan-Tilt-Tracking-System-Assembly.stl',
            colorSeed: 3
        },
        {
            type: 'video',
            src: '../vids/Shorter_Satellite_Tracking.mp4',
            caption: 'Full system demo — tracking a simulated shorter satellite'
        },
        {
            type: 'video',
            src: '../vids/Taller_Satellite_Tracking.mp4',
            caption: 'Full system demo — tracking a simulated taller satellite'
        },
        {
    type: 'csv-table',
    label: 'Full Scan Log (Raw Data)',
    src: '../graphs/full_scan_log_raw.csv'
},
{ type: 'heading', text: 'Key Design considerations for Motion:' },
        {
            type: 'image',
            src: '../assembled/axel+gimbal_connection.jpeg',
            caption: 'Axel Gimbal Connection',
            align: 'full'
        },
        {
            type: 'image',
            src: '../assembled/base+motor_connection.jpeg',
            caption: 'Base Motor Connection',
            align: 'full'
        },
        {
            type: 'image',
            src: '../assembled/motor gear connection.jpeg',
            caption: 'Motor Gear Connection',
            align: 'full'
        },
    ]);
</script>
</body>
</html>
