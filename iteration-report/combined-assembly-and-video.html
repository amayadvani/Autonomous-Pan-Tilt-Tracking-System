<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Combined Assembly and Video — Design Iteration Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/report-style.css">
</head>
<body>

<header id="site-header"></header>
<main id="content-root" class="report-content"></main>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>

<script src="../cad_viewer.js"></script>
<script src="js/report-common.js"></script>
<script>
    renderReportHeader('combined');

    renderReportContent('content-root', [
        { type: 'page-title', text: 'Combined Assembly and Video' },
        {
            type: 'text',
            html: `<p>Summarize how the individual parts come together into the full assembly,
            and embed or link the demo video below.</p>`
        },
        {
            type: 'image',
            src: 'images/full-assembly-photo.jpg',
            caption: 'Fully assembled Pan-Tilt Tracking System',
            align: 'full'
        },
        {
            type: 'viewer',
            label: 'Final System Assembly',
            stlPath: '../assembled/Autonomous-Pan-Tilt-Tracking-System-Assembly.stl',
            colorSeed: 2
        },
        {
            type: 'video',
            src: '../vids/Shorter_Satellite_Tracking.mp4',
            caption: 'Full system demo — tracking a simulated shorter satellite'
        },
        {
            type: 'video',
            src: '../vids/Taller_Satellite_Tracking.mp4',
            caption: 'Full system demo — tracking a simulated taller satellite'
        }
    ]);
</script>
</body>
</html>
