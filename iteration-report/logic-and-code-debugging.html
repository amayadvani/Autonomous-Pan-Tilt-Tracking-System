<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logic and Code Debugging — Design Iteration Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/report-style.css">
</head>
<body>

<header id="site-header"></header>
<main id="content-root" class="report-content"></main>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>

<script src="../cad_viewer.js"></script>
<script src="js/report-common.js"></script>
<script>
    renderReportHeader('logic');

    renderReportContent('content-root', [
        { type: 'page-title', text: 'Logic and Code Debugging' },
        {
            type: 'text',
            html: `<p>Document the control logic and any debugging process for the tracking
            algorithm here — pseudocode, flowcharts, or annotated code screenshots all work well
            as image blocks.</p>`
        },
        {
            type: 'image',
            src: 'images/tracking-logic-flowchart.png',
            caption: 'Signal-tracking control flow',
            align: 'full'
        },
        {
            type: 'text',
            html: `<p>Use additional text blocks to describe specific bugs you hit and how you
            fixed them.</p>`
        }
    ]);
</script>
</body>
</html>
