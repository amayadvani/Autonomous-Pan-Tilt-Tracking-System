        '<strong>The endpoint problem.</strong> When the pan servo reached the edge of its range at 1°, it had to wrap to 179° and resume searching from there. A single noisy reading at that moment could convince the system it had found the target, sending it sweeping across the entire 180° range for no reason. This was fixed by requiring the system to confirm a target at the endpoint before letting it search again, instead of reacting to one reading. It took several rewrites before this held up under repeated testing.',

    type: 'code',
    label: 'Final Tracking Algorithm',
    code: `#include <Servo.h>

// ============================================================
// PINS
// ============================================================
const byte SERVO1_PIN = 11;  // Pan servo
const byte SERVO2_PIN = 9;   // Tilt servo
const byte TRIG_PIN = 2;     // HC-SR04 TRIG
const byte ECHO_PIN = 3;     // HC-SR04 ECHO

// ============================================================
// SERVO LIMITS
// ============================================================
const int SERVO1_MIN = 1;
const int SERVO1_MAX = 179;

const int SERVO2_MIN = 75;
const int SERVO2_MAX = 135;

const int SERVO1_HOME = 90;
const int SERVO2_HOME = 105;

// ============================================================
// VALID HC-SR04 RANGE
// ============================================================
const float MIN_VALID_DISTANCE_CM = 3.0;
const float MAX_VALID_DISTANCE_CM = 15.0;

// ============================================================
// INITIAL ONE-TIME SWEEP
// ============================================================
const int SCAN_PAN_STEP = 15;
const int SCAN_TILT_STEP = 10;
const int SCAN_SETTLE_MS = 100;

const int RETURN_SETTLE_MS = 100;

// ============================================================
// CLOCKWISE TRACKING
// ============================================================
const int CLOCKWISE_PAN_DIRECTION = -1;
const int REACQUIRE_PAN_STEP = 1;
const int REACQUIRE_SETTLE_MS = 60;

const byte CONSECUTIVE_READS_REQUIRED = 3;

// ============================================================
// STATES
// ============================================================
enum TrackerState {
  HOLD_TARGET,
  STEP_TO_REACQUIRE,
  WAIT_FOR_VALID_AT_179,
  HOLD_CONFIRMED_AT_179
};

// ============================================================
// OBJECTS AND STATE VARIABLES
// ============================================================
Servo servo1;
Servo servo2;

int panAngle = SERVO1_HOME;
int tiltAngle = SERVO2_HOME;
int lockedTilt = SERVO2_HOME;

float currentDistance = -1.0;

bool initialScanComplete = false;
bool targetLocked = false;

byte endpointValidStreak = 0;
byte endpointLostStreak = 0;

TrackerState trackerState = HOLD_TARGET;

// ============================================================
// SERVO HELPERS
// ============================================================
void movePan(int angle) {
  panAngle = constrain(angle, SERVO1_MIN, SERVO1_MAX);
  servo1.write(panAngle);
}

void moveTilt(int angle) {
  tiltAngle = constrain(angle, SERVO2_MIN, SERVO2_MAX);
  servo2.write(tiltAngle);
}

// ============================================================
// HC-SR04 DISTANCE
// ============================================================
float readDistanceCM() {
  digitalWrite(TRIG_PIN, LOW);
  delayMicroseconds(2);

  digitalWrite(TRIG_PIN, HIGH);
  delayMicroseconds(10);

  digitalWrite(TRIG_PIN, LOW);

  unsigned long duration = pulseIn(ECHO_PIN, HIGH, 30000);

  if (duration == 0) {
    return -1.0;
  }

  float distance = duration / 58.0;

  if (distance < MIN_VALID_DISTANCE_CM ||
      distance > MAX_VALID_DISTANCE_CM) {
    return -1.0;
  }

  return distance;
}

// ============================================================
// SERIAL OUTPUT
// ============================================================

void printData(float distance, int state) {
  Serial.print(millis());
  Serial.print(",");
  Serial.print(panAngle);
  Serial.print(",");
  Serial.print(tiltAngle);
  Serial.print(",");
  Serial.print(distance, 2);
  Serial.print(",");
  Serial.println(state);
}

// ============================================================
// INITIAL SWEEP: COMPLETE GRID, KEEP TRUE SMALLEST DISTANCE
// ============================================================
void runInitialScan() {
  float shortestDistance = 9999.0;
  int bestPan = SERVO1_HOME;
  int bestTilt = SERVO2_HOME;

  for (int tilt = SERVO2_MIN;
       tilt <= SERVO2_MAX;
       tilt += SCAN_TILT_STEP) {

    for (int pan = SERVO1_MIN;
         pan <= SERVO1_MAX;
         pan += SCAN_PAN_STEP) {

      movePan(pan);
      moveTilt(tilt);
      delay(SCAN_SETTLE_MS);

      float distance = readDistanceCM();
      printData(distance, 0);
      delay(60);

      if (distance > 0.0 && distance < shortestDistance) {
        shortestDistance = distance;
        bestPan = pan;
        bestTilt = tilt;
      }
    }
  }

  initialScanComplete = true;

  if (shortestDistance == 9999.0) {
    targetLocked = false;
    movePan(SERVO1_HOME);
    moveTilt(SERVO2_HOME);
    Serial.println("NO_VALID_TARGET_IN_INITIAL_SCAN");
    return;
  }

  movePan(bestPan);
  moveTilt(bestTilt);
  delay(RETURN_SETTLE_MS);

  float confirmDistance = readDistanceCM();
  printData(confirmDistance, 5);
  delay(60);

  lockedTilt = bestTilt;

  if (confirmDistance > 0.0) {
    currentDistance = confirmDistance;
  } else {

    currentDistance = shortestDistance;
  }

  targetLocked = true;
  trackerState = HOLD_TARGET;

  Serial.print("INITIAL_SHORTEST_LOCK,");
  Serial.print(bestPan);
  Serial.print(",");
  Serial.print(bestTilt);
  Serial.print(",scan_value=");
  Serial.print(shortestDistance, 2);
  Serial.print(",confirmed_value=");
  Serial.println(currentDistance, 2);
}

// ============================================================
// STATE: HOLD TARGET AT NORMAL PAN ANGLE
// ============================================================
void holdTarget() {
  movePan(panAngle);
  moveTilt(lockedTilt);

  float distance = readDistanceCM();
  printData(distance, 1);
  delay(60);

  if (distance > 0.0) {
    currentDistance = distance;
    return;
  }

  trackerState = STEP_TO_REACQUIRE;
  Serial.println("TARGET_LOST_START_1_DEGREE_STEPPING");
}

// ============================================================
// STATE: STEP CLOCKWISE (-1) TO REACQUIRE
// ============================================================
void stepClockwiseToReacquire() {
  moveTilt(lockedTilt);

  float distance = readDistanceCM();
  printData(distance, 2);
  delay(60);

  if (distance > 0.0) {
    currentDistance = distance;
    trackerState = HOLD_TARGET;
    Serial.println("TARGET_REACQUIRED_HOLDING");
    return;
  }

  int nextPan = panAngle +
                (CLOCKWISE_PAN_DIRECTION * REACQUIRE_PAN_STEP);

  if (nextPan < SERVO1_MIN) {
    movePan(SERVO1_MAX);
    moveTilt(lockedTilt);
    panAngle = SERVO1_MAX;

    endpointValidStreak = 0;
    endpointLostStreak = 0;

    trackerState = WAIT_FOR_VALID_AT_179;
    Serial.println("WRAP_TO_179_WAITING_FOR_VALID");
    return;
  }

  movePan(nextPan);
  moveTilt(lockedTilt);
  delay(REACQUIRE_SETTLE_MS);
}

// ============================================================
// STATE: WAIT AT 179° FOR CONSECUTIVE VALID READINGS
// ============================================================
void waitForValidAt179() {
  movePan(SERVO1_MAX);
  moveTilt(lockedTilt);

  float distance = readDistanceCM();
  printData(distance, 3);
  delay(60);

  if (distance < 0.0) {
    endpointValidStreak = 0;
    return;
  }

  endpointValidStreak++;
  currentDistance = distance;

  Serial.print("ENDPOINT_VALID_STREAK,");
  Serial.println(endpointValidStreak);

  if (endpointValidStreak < CONSECUTIVE_READS_REQUIRED) {
    return;
  }

  panAngle = SERVO1_MAX;
  endpointValidStreak = 0;
  endpointLostStreak = 0;
  trackerState = HOLD_CONFIRMED_AT_179;

  Serial.println("TARGET_VALID_AT_179_CONFIRMED_HOLD");
}

// ============================================================
// STATE: CONFIRMED HOLD AT 179°
// ============================================================
void holdConfirmedAt179() {
  movePan(SERVO1_MAX);
  moveTilt(lockedTilt);

  float distance = readDistanceCM();
  printData(distance, 4);
  delay(60);

  if (distance > 0.0) {
    currentDistance = distance;
    endpointLostStreak = 0;
    return;
  }

  endpointLostStreak++;

  Serial.print("ENDPOINT_LOST_STREAK,");
  Serial.println(endpointLostStreak);

  if (endpointLostStreak < CONSECUTIVE_READS_REQUIRED) {
    return;
  }

  panAngle = SERVO1_MAX;
  endpointLostStreak = 0;
  trackerState = STEP_TO_REACQUIRE;

  Serial.println("TARGET_LEFT_179_START_1_DEGREE_STEPPING");
}

// ============================================================
// SETUP
// ============================================================
void setup() {
  Serial.begin(115200);

  servo1.attach(SERVO1_PIN);
  servo2.attach(SERVO2_PIN);

  pinMode(TRIG_PIN, OUTPUT);
  pinMode(ECHO_PIN, INPUT);

  movePan(SERVO1_HOME);
  moveTilt(SERVO2_HOME);

  delay(1000);

  Serial.println("TimeMS,PanAngle,TiltAngle,DistanceCM,State");
}

// ============================================================
// MAIN LOOP
// ============================================================
void loop() {
  if (!initialScanComplete) {
    runInitialScan();
    return;
  }

  if (!targetLocked) {
    return;
  }

  if (trackerState == HOLD_TARGET) {
    holdTarget();
    return;
  }

  if (trackerState == STEP_TO_REACQUIRE) {
    stepClockwiseToReacquire();
    return;
  }

  if (trackerState == WAIT_FOR_VALID_AT_179) {
    waitForValidAt179();
    return;
  }

  if (trackerState == HOLD_CONFIRMED_AT_179) {
    holdConfirmedAt179();
  }
}`
},
{

// ==================================================
// ULN2003 STEPPER DRIVER PINS
// ==================================================
const byte IN1_PIN = 3;
const byte IN2_PIN = 4;
const byte IN3_PIN = 5;
const byte IN4_PIN = 6;

// ==================================================
// POTENTIOMETER PIN
// ==================================================
const byte POT_PIN = A0;

// ==================================================
// MOTOR SETTINGS
// ==================================================

const float MAX_SPEED = 1500.0;

const int DEAD_BAND = 35;

AccelStepper stepper(
  AccelStepper::HALF4WIRE,
  IN1_PIN,
  IN3_PIN,
  IN2_PIN,
  IN4_PIN
);

// ==================================================
// SETUP
// ==================================================
void setup() {
  stepper.setMaxSpeed(MAX_SPEED);

  Serial.begin(9600);
}

// ==================================================
// MAIN LOOP
// ==================================================
void loop() {
  int potValue = analogRead(POT_PIN);
  int centeredValue = potValue - 512;
  float targetSpeed = 0.0;
  if (abs(centeredValue) > DEAD_BAND) {

    if (centeredValue > 0) {
      targetSpeed =
        (float)(centeredValue - DEAD_BAND) *
        MAX_SPEED /
        (511 - DEAD_BAND);

    } else {
      targetSpeed =
        (float)(centeredValue + DEAD_BAND) *
        MAX_SPEED /
        (512 - DEAD_BAND);
    }
  }

  stepper.setSpeed(targetSpeed);
  stepper.runSpeed();

}`
}

</script>
