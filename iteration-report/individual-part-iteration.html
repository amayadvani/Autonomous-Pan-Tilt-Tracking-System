<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Individual Part Iteration — Design Iteration Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/report-style.css">
</head>
<body>

<header id="site-header"></header>
<main id="content-root" class="report-content"></main>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>

<script src="../cad_viewer.js"></script>
<script src="js/report-common.js"></script>
<script>
    renderReportHeader('individual');

    renderReportContent('content-root', [
        { type: 'page-title', text: 'Individual Part Iteration' },
        {
            type: 'text',
            html: `<p>The physical mount went through many CAD revisions, 
                and just as many print attempts, because I was learning the 
                constraints of both the slicer software and my 3D printer at the 
                same time as I was designing the part. Getting the pan/tilt bracket 
                to a point where it held the servos rigidly, without binding their
                range of motion, took multiple full print cycles before it was usable.</p>`
        },
        {
            type: 'text',
            html: `<h3 class="report-subheading">Each iteration meant:</h3>
            <ul class="report-bullets">
            <li><strong>1. </strong> Adjust the model in CAD based on what the last print got wrong.</li>
            <li><strong>2. </strong> Re-slice and re-print.</li>
            <li><strong>3. </strong> Test-fit the servos and sensor against the physical part.</li>
            <li><strong>4. </strong> Find the next thing that was wrong, and repeat.</li>
            </ul>`
        },
        {
    type: 'bullets',
    heading: 'What went wrong',
    items: [
        'Unaligned bores.',
        'Unconsistent tolerances.',
        'Print orientations that caused a mounting face to warp or need supports.',
        'Layer adhesion issues.',
        'Material shrinkage.',
        'Strength issues with thin walls.'
    ]
},
        { type: 'heading', text: 'Gimbal Base: Most Variable Design' },
        {
          type: 'image-grid',
          featureFirst: true,
          images: [
            { src: '../sensor base/failed sensor base.jpeg', caption: 'Failed sensor base' },
            { src: '../sensor base/gear closeup.jpeg', caption: 'Gearcloseup' },
            { src: '../sensor base/warped.jpeg', caption: 'Warped Base' },
            { src: '../assembled/gimbal.jpeg', caption: 'Final Servo Gimbal with Range Sensor' }]
        },
        { type: 'heading', text: 'Turntable Base: Broken Axel Iterations' },
{
    type: 'image-grid',
    featureFirst: true,
    images: [
        { src: '../turntable base/broken axel v2.jpeg', caption: 'Broken Axel V2' },
        { src: '../turntable base/connectorandsquareaxel.jpeg', caption: 'Connector And Square Axel' },
        { src: '../turntable base/failed turntable bases.jpeg', caption: 'Failed Turntable Bases' },
        { src: '../turntable base/warped and broken v1.jpeg', caption: 'Warped And Broken V1' }
    ]
},
{ type: 'heading', text: 'Turntable: Assembly Versions' },
{
    type: 'image-grid',
    featureFirst: true,
    images: [
        { src: '../turntable/turntable v1.jpeg', caption: 'Turntable V1' },
        { src: '../turntable/turntablev2.jpeg', caption: 'Turntable V2' },
        { src: '../turntable/turntable v3+v4.jpeg', caption: 'Turntable V3+V4' }
    ]
},
{ type: 'heading', text: 'Additional Components: Bearings, Gears, Motor Holder, Servo Base & Gusset' },
{
    type: 'image-grid',
    featureFirst: false,
    images: [
        { src: '../bearings/bearing holders.jpeg', caption: 'Bearing Holders' },
        { src: '../gears/gears.jpeg', caption: 'Gears' },
        { src: '../motor holder/failed motor holders.jpeg', caption: 'Failed Motor Holders' },
        { src: '../servo base/servo bases.jpeg', caption: 'Servo Bases' },
        { src: '../servo gusset/servo gussets.jpeg', caption: 'Servo Gussets' }
    ]
},
        {
            type: 'viewer',
            label: 'Current Version (3D)',
            stlPath: '../gears/YourFile.stl',
            colorSeed: 3
        }
    ]);
</script>
</body>
</html>
